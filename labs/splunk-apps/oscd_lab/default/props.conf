# Parsing set explicitly rather than left to inference.
#
# SPL-06 Topic 6 and SPL-08 Topic 12 both argue that the parsing settings should
# be stated, not inferred, because inference works until the data changes shape.
# This app practises what the curriculum preaches: line breaking, timestamp
# handling, truncation and charset are all explicit.

[default]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
CHARSET = UTF-8
MAX_TIMESTAMP_LOOKAHEAD = 40

[oscd:winauth]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = _time
TIME_FORMAT = %s.%3N
category = Custom
description = OSCD lab: Windows-style authentication (CIM Authentication)

