# Macros used across the lab guides, so a learner types the intent not the plumbing.

[oscd_auth]
definition = index=wineventlog sourcetype=oscd:winauth
iseval = 0

[oscd_proc]
definition = index=sysmon sourcetype=oscd:sysmon
iseval = 0

[oscd_web]
definition = index=proxy sourcetype=oscd:proxy
iseval = 0

[oscd_dns]
definition = index=dns sourcetype=oscd:dns
iseval = 0

[oscd_cloud]
definition = index=cloud sourcetype=oscd:cloud
iseval = 0

[oscd_fw]
definition = index=fw sourcetype=oscd:fw
iseval = 0

[oscd_ids]
definition = index=ids sourcetype=oscd:ids
iseval = 0

[oscd_risk]
definition = index=risk sourcetype=oscd:risk
iseval = 0

# Exponential risk decay. `ln(2)` not `log(2)`: log() is base 10 in SPL and the
# error is silent (SPL-09 Topic 10).
[oscd_decay(1)]
args = half_life_days
definition = eval oscd_lambda = ln(2) / $half_life_days$ \
    | eval oscd_age_days = (now() - _time) / 86400 \
    | eval decayed_score = risk_score * exp(-oscd_lambda * oscd_age_days)
iseval = 0
