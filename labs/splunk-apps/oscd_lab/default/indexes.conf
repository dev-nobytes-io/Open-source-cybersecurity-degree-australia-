# Separate indexes per source, deliberately.
# SPL-06 Topic 4 argues index separation is what makes least-privilege RBAC
# possible at all, because Splunk's access control is index-scoped. An estate
# with one big index cannot enforce it. The lab is built the way the curriculum
# says it should be.

[wineventlog]
homePath   = $SPLUNK_DB/wineventlog/db
coldPath   = $SPLUNK_DB/wineventlog/colddb
thawedPath = $SPLUNK_DB/wineventlog/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 2048

