# relay-01: receive over TLS from sources, buffer to disk, filter, forward to
# central over TLS. The queue is the point of this node — size it on purpose
# (Lab 3 step 2) and know what happens when it fills (reflection 1 and 4).
global(workDirectory="/var/spool/rsyslog"
       DefaultNetstreamDriver="gtls"
       DefaultNetstreamDriverCAFile="/certs/ca.pem"
       DefaultNetstreamDriverCertFile="/certs/relay-01.pem"
       DefaultNetstreamDriverKeyFile="/certs/relay-01.key")

module(load="imuxsock")
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1"
       StreamDriver.AuthMode="x509/name" PermittedPeer=["src-01", "src-02"])
input(type="imtcp" port="6514" ruleset="relay")

ruleset(name="relay") {
  # Filter AT THE RELAY, before the WAN: drop the debug facility. This is a
  # documented blind spot — the full stream still exists on the source.
  if ($syslogfacility-text == "local7") then stop

  action(type="omfwd" target="central-01" port="6514" protocol="tcp"
         StreamDriver="gtls" StreamDriverMode="1"
         StreamDriverAuthMode="x509/name" StreamDriverPermittedPeers="central-01"
         queue.type="LinkedList" queue.filename="relayq"
         queue.size="200000" queue.highwatermark="150000" queue.lowwatermark="50000"
         queue.maxdiskspace="512m" queue.discardmark="190000" queue.discardseverity="7"
         queue.saveonshutdown="on"
         action.resumeRetryCount="-1" action.resumeInterval="5")
}
# The relay's own daemon messages ride the same path (Lab 3 step 7).
*.* call relay
