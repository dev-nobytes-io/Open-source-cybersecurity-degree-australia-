# src-01: forward auditd and system logs to the relay over TLS. Nothing leaves
# this host in cleartext, and a local disk queue rides out a relay outage.
global(workDirectory="/var/spool/rsyslog"
       DefaultNetstreamDriver="gtls"
       DefaultNetstreamDriverCAFile="/certs/ca.pem"
       DefaultNetstreamDriverCertFile="/certs/src-01.pem"
       DefaultNetstreamDriverKeyFile="/certs/src-01.key")

module(load="imuxsock")
module(load="imfile")

# auditd writes its own file; rsyslog tails it. local6 = audit stream.
input(type="imfile" File="/var/log/audit/audit.log" Tag="auditd:"
      Facility="local6" Severity="info" ruleset="fwd")
# A deliberately noisy debug stream (local7) — the facility Lab 3 step 4 drops
# at the relay, and documents as a blind spot.
input(type="imfile" File="/var/log/lab/debug.log" Tag="labdebug:"
      Facility="local7" Severity="debug" ruleset="fwd")

ruleset(name="fwd") {
  action(type="omfwd" target="relay-01" port="6514" protocol="tcp"
         StreamDriver="gtls" StreamDriverMode="1"
         StreamDriverAuthMode="x509/name" StreamDriverPermittedPeers="relay-01"
         queue.type="LinkedList" queue.filename="srcq"
         queue.maxdiskspace="100m" queue.saveonshutdown="on"
         action.resumeRetryCount="-1" action.resumeInterval="5")
}
*.* call fwd
