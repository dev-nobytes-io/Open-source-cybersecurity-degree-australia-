# central-01: receive over TLS from the relay and write originals, unaltered,
# to one append-only file per source host per day.
global(workDirectory="/var/spool/rsyslog"
       DefaultNetstreamDriver="gtls"
       DefaultNetstreamDriverCAFile="/certs/ca.pem"
       DefaultNetstreamDriverCertFile="/certs/central-01.pem"
       DefaultNetstreamDriverKeyFile="/certs/central-01.key")

module(load="imuxsock")
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1"
       StreamDriver.AuthMode="x509/name" PermittedPeer=["relay-01"])
input(type="imtcp" port="6514" ruleset="store")

# %rawmsg-after-pri% keeps the message exactly as received: no reformatting,
# no re-timestamping. The digest in Lab 3 step 3 is over these bytes.
template(name="perhost" type="string"
         string="/var/log/central/%HOSTNAME%/%$year%-%$month%-%$day%.log")
template(name="raw" type="string" string="%rawmsg-after-pri%\n")

ruleset(name="store") {
  action(type="omfile" dynaFile="perhost" template="raw" createDirs="on")
}
*.* call store
